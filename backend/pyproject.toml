[project]
name = "leadgen-backend"
version = "0.1.0"
description = "WhatsApp AI sales agent backend: lead qualification, product recommendations and demo booking"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.19",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    # Validation & Config
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    # Google Calendar
    "google-api-python-client>=2.160",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    # Email (stdlib smtplib — no extra dep needed)
    # Logging
    "structlog>=24.0",
    "email-validator>=2.3.0",
    "openai>=1.68",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
